name: Build AUTO TOKEN APK

on:
  push:
    branches:
      - "claude/java-project-apk-1zhidv"
    paths:
      - "android-app/**"
      - "admin-app/**"
      - "bot-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Make admin gradlew executable
        working-directory: admin-app
        run: chmod +x ./gradlew

      - name: Build Admin debug APK
        working-directory: admin-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Make bot gradlew executable
        working-directory: bot-app
        run: chmod +x ./gradlew

      - name: Build Bot Automation debug APK
        working-directory: bot-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoToken-apks
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            admin-app/app/build/outputs/apk/debug/app-debug.apk
            bot-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit APKs into repo (dist/)
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp admin-app/app/build/outputs/apk/debug/app-debug.apk dist/admin-app-debug.apk
          cp bot-app/app/build/outputs/apk/debug/app-debug.apk dist/bot-app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/app-debug.apk dist/admin-app-debug.apk dist/bot-app-debug.apk
          git commit -m "Build all APK artifacts [skip ci]" || echo "no changes"
          git push origin HEAD:${GITHUB_REF_NAME}
