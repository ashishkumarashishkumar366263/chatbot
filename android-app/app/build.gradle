plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autotoken.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.autotoken.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android framework only — no AndroidX, no Material.
    // org.json is bundled with the Android platform.
}
